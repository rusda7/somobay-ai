
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Admin - ডকুমেন্ট আপলোড</title>
<style>
body{font-family: Nirmala UI, sans-serif; max-width:800px; margin:20px auto; padding:20px;}
.progress{width:100%; background:#eee; border-radius:10px; overflow:hidden; margin:15px 0; display:none;}
.progress-bar{height:28px; background:linear-gradient(90deg,#2196F3,#21CBF3); width:0%; text-align:center; color:white; line-height:28px; transition:width 0.5s; font-weight:bold;}
.alert{padding:12px; border-radius:6px; margin:10px 0;}
.success{background:#d4edda; color:#155724; border:1px solid #c3e6cb;}
.error{background:#f8d7da; color:#721c24; border:1px solid #f5c6cb;}
.info{background:#d1ecf1; color:#0c5460; border:1px solid #bee5eb;}
</style>
</head>
<body>
<h2>Admin Panel - ডকুমেন্ট আপলোড (V11.1 Fixed)</h2>
<p>বড় ফাইল Timeout হবে না, Background এ 0% থেকে 100% হবে।</p>

<form method="POST" enctype="multipart/form-data" id="uploadForm">
<input type="file" name="files" multiple accept=".txt,.pdf" id="fileInput">
<button type="submit">আপলোড ও AI কে শেখান</button>
</form>

<div class="progress" id="progressWrap">
<div class="progress-bar" id="progressBar">0%</div>
</div>
<div id="progressText" class="alert info" style="display:none;"></div>

<hr>
<p>Embeddings আছে? <b id="hasEmb">{{ has_emb }}</b> | <a href="/debug" target="_blank">Debug</a> | Chunk: <span id="chunkCount">-</span></p>

<h3>আপলোড করা ফাইল:</h3>
<ul>
{% for file in files %}
<li>{{ file }}</li>
{% endfor %}
</ul>

<a href="/">Chat এ ফিরে যান</a>

<script>
let interval = null;
function checkProgress(){
fetch('/api/progress').then(r=>r.json()).then(data=>{
let wrap = document.getElementById('progressWrap');
let bar = document.getElementById('progressBar');
let txt = document.getElementById('progressText');
let hasEmbEl = document.getElementById('hasEmb');
let chunkEl = document.getElementById('chunkCount');
if(hasEmbEl) hasEmbEl.textContent = data.has_emb;
if(chunkEl) chunkEl.textContent = data.chunk_count || 0;

if(data.status === 'running'){
wrap.style.display='block';
txt.style.display='block';
let pct = data.total>0 ? Math.round(data.done*100/data.total) : 0;
bar.style.width = pct+'%';
bar.textContent = pct+'%';
txt.textContent = data.message + ` (${data.done}/${data.total})`;
txt.className='alert info';
}else if(data.status === 'done'){
wrap.style.display='block';
bar.style.width='100%';
bar.textContent='100%';
txt.style.display='block';
txt.textContent = data.message + ` | Embeddings: ${data.has_emb} | Chunks: ${data.chunk_count}`;
txt.className='alert success';
if(data.has_emb){
setTimeout(()=>{ window.location.href='/'; }, 1500);
}
clearInterval(interval);
}else if(data.status === 'error'){
txt.style.display='block';
txt.textContent = data.message;
txt.className='alert error';
clearInterval(interval);
}
});
}
setInterval(checkProgress, 1000);
checkProgress();
</script>
</body>
</html>
